name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    name: Nightly build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Assemble
        env:
          ALLOW_DEBUG_SIGNING: 'true'
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          version=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          commit=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/release/*.apk "dist/diskusage-nightly-$version-$commit.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          ls -l dist

      - name: Update nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          make_latest: false
          body: |
            Automatic build of `${{ github.ref_name }}` at `${{ github.sha }}`.

            This APK is signed with the debug key and must not be used for
            upgrading an installation from F-Droid or a signed release.
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
