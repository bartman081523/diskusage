AutoName: DiskUsage NG
Description: |-
  Turns the storage into a readable map: every folder becomes a rectangle whose
  area matches the space it occupies, with several levels of subfolders visible
  at the same time. Zoom in to inspect a folder, tap to select, double tap to
  open, and delete the blocks that waste the most space.

  This is the maintained continuation of DiskUsage. The original app stopped at
  an alpha release in 2023; this version was rebuilt for current Android, with a
  working native scanner, reliable volume detection (internal storage, SD cards,
  USB drives) and current permission handling.

  Features:
  * storage map with per-app breakdown into code, data and cache
  * used/free space including the occupied percentage
  * search across the scanned tree
  * folder and file opening through any installed file manager or viewer
  * delete confirmation that lists what will be removed
  * dark mode, adaptive and themed icons, TV banner
  * no ads, no tracking and no network access

RepoType: git
